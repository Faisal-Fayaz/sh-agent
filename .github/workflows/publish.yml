name: publish

# Releases are cut by pushing a tag, and nothing else publishes to PyPI. The
# artifacts are built here, in the same job that verifies and uploads them, so
# there is no local dist/ that can drift out of sync with the tree -- which is
# how 0.1.1 reached PyPI containing none of the fixes it was cut from.
#
# Requires a trusted publisher on PyPI (project -> Settings -> Publishing):
#   owner: Faisal-Fayaz  repo: sh-agent  workflow: publish.yml  env: pypi
# No API token is stored anywhere, and the OIDC exchange is what authorises it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv python install 3.12

      - run: uv sync --frozen --extra dev --python 3.12

      # Nothing is published that has not passed the suite: a tag is not a
      # substitute for a green build.
      - run: uv run --frozen pytest -q

      - run: uv run --frozen ruff check .

      - run: uv run --frozen ruff format --check .

      # The tag and the package version must agree. Without this a typo in
      # pyproject.toml publishes the wrong version under a tag that claims
      # otherwise, and PyPI does not let you take it back.
      - name: check the tag matches the version being built
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run --frozen python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          echo "tag: $tag  pyproject: $pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $pkg"; exit 1; }

      - run: uv run --frozen python -m build

      # Building is not the same as building the right thing. These assertions
      # read the artifacts themselves, so a wheel built from a stale tree fails
      # here rather than on PyPI.
      - name: verify the artifacts match the tag and contain the code
        run: |
          uv run --frozen python - "$GITHUB_REF_NAME" <<'PY'
          import pathlib, sys, tarfile, tomllib, zipfile

          tag = sys.argv[1].removeprefix("v")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          assert tag == version, f"tag {tag} != version {version}"

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          assert version in wheel.name and version in sdist.name, "filename carries the wrong version"

          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              metadata = z.read(next(n for n in names if n.endswith("METADATA"))).decode()

          assert f"Version: {version}" in metadata, "wheel metadata carries the wrong version"

          # A wheel built from a stale tree is the failure 0.1.1 shipped with, so
          # every module the package promises to contain is checked by name.
          expected = {
              "sh_agent/__init__.py",
              "sh_agent/__main__.py",
              "sh_agent/auth.py",
              "sh_agent/config.py",
              "sh_agent/onboarding.py",
              "sh_agent/pty_session.py",
              "sh_agent/registry.py",
          }
          missing = expected - set(names)
          assert not missing, f"wheel is missing {sorted(missing)}"

          with tarfile.open(sdist) as t:
              members = t.getnames()
          assert any(m.endswith("pyproject.toml") for m in members), "sdist is missing pyproject.toml"
          assert any("/tests/" in m for m in members), "sdist is missing the tests"

          print(f"verified {wheel.name} and {sdist.name} at version {version}")
          PY

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
