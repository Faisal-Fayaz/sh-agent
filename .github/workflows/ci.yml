name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11 and the classifier list claims 3.13, so all
        # three are checked. 3.11 is the one that catches syntax that crept in
        # from a newer interpreter without a test noticing.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ matrix.python }}

      # --frozen fails rather than silently re-resolving, so a lockfile that no
      # longer matches pyproject.toml breaks the build instead of drifting.
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      # The suite includes a fake tailscaled socket, so it needs no network and
      # no daemon: the identity path is exercised on a bare runner.
      - run: uv run --frozen pytest -q

      - run: uv run --frozen ruff check .

      - run: uv run --frozen ruff format --check .

  windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pywinpty is a win32-only dependency; --frozen proves the lockfile
      # resolves for this platform as well as the others.
      - run: uv sync --frozen --extra dev

      # The suite's POSIX half is about tmux, systemd and process groups, and
      # asserting on it here would be asserting on the absence of Windows. What
      # is worth a Windows runner is the part that has a Windows branch: the
      # session core on a fake backend, the ConPTY integration test, the text
      # handling, the argument splitting and the documented defaults.
      - run: uv run --frozen pytest tests/test_pty_session.py tests/test_docs.py -q

      - run: uv run --frozen ruff check .

      # install.sh is covered by the installer job on Linux; install.ps1 can
      # only be read on Windows, and parsing it is the cheapest thing that can
      # be said about it without running it.
      - name: the installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }

      # The claim the backend has to earn on this platform: the agent starts,
      # binds, and answers. Nothing short of running it says that.
      - name: the agent starts and serves
        shell: pwsh
        run: |
          $env:SH_TOKEN = "ci-token"
          $env:SH_HOST = "127.0.0.1"
          $env:SH_PORT = "8791"
          $env:SH_AUDIT = "$env:RUNNER_TEMP\audit.log"
          $agent = Start-Process -FilePath "uv" -PassThru -NoNewWindow `
            -ArgumentList "run", "--frozen", "sh-agent" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\agent.out.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\agent.err.log"
          try {
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 1
              if ($agent.HasExited) { break }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8791/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  Write-Host "healthy: version $($health.version), shell $($health.shell)"
                  exit 0
                }
              } catch { }
            }
            Write-Host "--- agent stdout ---"; Get-Content "$env:RUNNER_TEMP\agent.out.log" -ErrorAction SilentlyContinue
            Write-Host "--- agent stderr ---"; Get-Content "$env:RUNNER_TEMP\agent.err.log" -ErrorAction SilentlyContinue
            Write-Host "the agent never answered on /health"
            exit 1
          } finally {
            if (-not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
          }

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: bash -n scripts/install.sh

      - run: bash -n scripts/serverctl.sh

      # ubuntu-latest ships shellcheck. It is worth gating on: install.sh is the
      # first thing a new user runs, and it is the only file here with no tests.
      - run: shellcheck scripts/install.sh scripts/serverctl.sh
