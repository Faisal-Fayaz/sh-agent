[project]
name = "sh-agent"
version = "0.1.0"
description = "Tailscale-reachable PTY agent with a gesture-friendly command palette API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "websockets>=12",
]

[project.scripts]
sh-agent = "sh_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sh_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = [
    "ASYNC109",
    "E501",
    "B008",
    "SIM105",
    "SIM108",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
