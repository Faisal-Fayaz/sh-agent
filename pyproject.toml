[project]
name = "sh-agent"
version = "0.1.1"
description = "Gesture-friendly terminal agent. Gives a phone a real interactive shell on your machine over Tailscale."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Faisal Fayaz" }]
keywords = ["terminal", "pty", "tmux", "tailscale", "mobile", "ssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "segno>=1.6",
]

[project.urls]
Homepage = "https://github.com/Faisal-Fayaz/sh-agent"
Repository = "https://github.com/Faisal-Fayaz/sh-agent"
Issues = "https://github.com/Faisal-Fayaz/sh-agent/issues"
Client = "https://github.com/Faisal-Fayaz/sh-app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "websockets>=12",
]

[project.scripts]
sh-agent = "sh_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sh_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = [
    "ASYNC109",
    "E501",
    "B008",
    "SIM105",
    "SIM108",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
